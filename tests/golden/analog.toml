instrument = "cymbal"
schema = 1
seed = 1                    # the cymbal: where its modes lie
take = 1                    # the strike: round robins use take, take + 1, …

[[noise]]                   # noise[1]
level_db   = -2.0
band_hz    = [6000.0, 16000.0]
spacing_hz = 14.0           # mean distance between modes; 0 = continuous noise
damping    = 0.5            # content at f decays (f / f_ref)^damping times faster
bloom      = 0.0            # and rises (f / f_ref)^bloom times slower
chatter    = 0.0            # 0 … 1: gated at chatter_hz, as plates that slap
chatter_hz = 220.0
amp = [                     # shape: 0 at both ends, peak exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 0.3,   gain = 1.0 },
  { ms = 8.0,   gain = 0.45 },
  { ms = 30.0,  gain = 0.14 },
  { ms = 70.0,  gain = 0.04 },
  { ms = 120.0, gain = 0.0 },
]

[[noise]]                   # noise[2]
level_db   = -10.0
band_hz    = [3000.0, 18000.0]
spacing_hz = 0.0            # mean distance between modes; 0 = continuous noise
damping    = 0.0            # content at f decays (f / f_ref)^damping times faster
bloom      = 0.0            # and rises (f / f_ref)^bloom times slower
chatter    = 0.0            # 0 … 1: gated at chatter_hz, as plates that slap
chatter_hz = 220.0
amp = [                     # shape: 0 at both ends, peak exactly 1
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.03, gain = 1.0 },
  { ms = 0.13, gain = 0.6 },
  { ms = 1.5,  gain = 0.1 },
  { ms = 5.0,  gain = 0.0 },
]

[[tone]]                    # tone[1]
level_db = -3.0
wave     = "square"         # "sine" | "square"
phase    = "free"           # "strike" | "free"
partials = [                # loudest exactly 0 dB; at the nearest 1/8 Hz
  { hz = 205.3, level_db = 0.0 },
  { hz = 304.4, level_db = 0.0 },
  { hz = 369.6, level_db = 0.0 },
  { hz = 522.7, level_db = 0.0 },
  { hz = 540.0, level_db = 0.0 },
  { hz = 800.0, level_db = 0.0 },
]
band_hz    = [7000.0, 16000.0]
damping    = 0.3            # content at f decays (f / f_ref)^damping times faster
bloom      = 0.0            # and rises (f / f_ref)^bloom times slower
chatter    = 0.0            # 0 … 1: gated at chatter_hz, as plates that slap
chatter_hz = 220.0
amp = [                     # shape: 0 at both ends, peak exactly 1
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.02, gain = 1.0 },
  { ms = 0.12, gain = 0.7 },
  { ms = 20.0, gain = 0.12 },
  { ms = 60.0, gain = 0.0 },
]

[damper]                    # multiplies every source: 1 until damped, then 0
amp = []                    # no knots: never damped

[drive]
db = 0.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak"
db          = -6.0          # gain in dB, or peak target in dBFS
polarity    = 1
