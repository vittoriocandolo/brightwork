instrument = "cymbal"
schema = 1
seed = 3                    # the cymbal: where its modes lie
take = 2                    # the strike: round robins use take, take + 1, …

[[noise]]                   # noise[1]
level_db   = -12.0
band_hz    = [2500.0, 12000.0]
spacing_hz = 110.0          # mean distance between modes; 0 = continuous noise
damping    = 0.5            # content at f decays (f / f_ref)^damping times faster
bloom      = 0.0            # and rises (f / f_ref)^bloom times slower
chatter    = 0.3            # 0 … 1: gated at chatter_hz, as plates that slap
chatter_hz = 180.0
grains_hz  = 300.0          # collisions per second at the shape's peak, a rattle; 0 = none
grain_ms   = 50.0           # each collision rings down 60 dB in this time
amp = [                     # shape: 0 at both ends, peak exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 15.0,  gain = 1.0 },
  { ms = 80.0,  gain = 0.5 },
  { ms = 250.0, gain = 0.12 },
  { ms = 450.0, gain = 0.0 },
]

[[tone]]                    # tone[1]
level_db = -18.0
wave     = "sine"           # "sine" | "square"
phase    = "strike"         # "strike" | "free"
partials = [                # loudest exactly 0 dB; at the nearest 1/8 Hz
  { hz = 180.0, level_db = 0.0 },
  { hz = 290.0, level_db = -6.0 },
]
band_hz    = [100.0, 2000.0]
damping    = 0.3            # content at f decays (f / f_ref)^damping times faster
bloom      = 0.0            # and rises (f / f_ref)^bloom times slower
chatter    = 0.0            # 0 … 1: gated at chatter_hz, as plates that slap
chatter_hz = 220.0
grains_hz  = 300.0          # collisions per second at the shape's peak, a rattle; 0 = none
grain_ms   = 30.0           # each collision rings down 60 dB in this time
amp = [                     # shape: 0 at both ends, peak exactly 1
  { ms = 0.0,   gain = 0.0 },
  { ms = 15.0,  gain = 1.0 },
  { ms = 80.0,  gain = 0.5 },
  { ms = 250.0, gain = 0.12 },
  { ms = 450.0, gain = 0.0 },
]

[storage]                   # low-resolution memory: the sources stored, then played back
bits      = 0               # 0 = off; else 2 … 16, quantized against the sound's peak
rate_hz   = 32000.0         # stored at this rate, as near as the internal rate allows
filter_hz = 16000.0         # played back through a low-pass, −3 dB here

[damper]                    # multiplies every source: 1 until damped, then 0
amp = []                    # no knots: never damped

[drive]
db = 6.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 44100
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak" | "true-peak"
db          = -6.0          # gain in dB, or peak target in dBFS
polarity    = 1
