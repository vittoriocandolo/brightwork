instrument = "cymbal"
schema = 1
seed = 1                    # the cymbal: where its modes lie
take = 1                    # the strike: round robins use take, take + 1, …

[[noise]]                   # noise[1]
level_db   = -13.6
band_hz    = [400.0, 18000.0]
spacing_hz = 18.0           # mean distance between modes; 0 = continuous noise
damping    = 0.9            # content at f decays (f / f_ref)^damping times faster
bloom      = 0.4            # and rises (f / f_ref)^bloom times slower
chatter    = 0.0            # 0 … 1: gated at chatter_hz, as plates that slap
chatter_hz = 220.0
amp = [                     # shape: 0 at both ends, peak exactly 1
  { ms = 0.0,    gain = 0.0 },
  { ms = 2.0,    gain = 1.0 },
  { ms = 180.0,  gain = 0.55 },
  { ms = 700.0,  gain = 0.2 },
  { ms = 1500.0, gain = 0.06 },
  { ms = 2500.0, gain = 0.018 },
  { ms = 3500.0, gain = 0.005 },
  { ms = 4500.0, gain = 0.0 },
]

[[noise]]                   # noise[2]
level_db   = -22.6
band_hz    = [2000.0, 18000.0]
spacing_hz = 0.0            # mean distance between modes; 0 = continuous noise
damping    = 0.0            # content at f decays (f / f_ref)^damping times faster
bloom      = 0.0            # and rises (f / f_ref)^bloom times slower
chatter    = 0.0            # 0 … 1: gated at chatter_hz, as plates that slap
chatter_hz = 220.0
amp = [                     # shape: 0 at both ends, peak exactly 1
  { ms = 0.0,  gain = 0.0 },
  { ms = 0.05, gain = 1.0 },
  { ms = 0.15, gain = 0.6 },
  { ms = 3.0,  gain = 0.1 },
  { ms = 10.0, gain = 0.0 },
]

[damper]                    # multiplies every source: 1 until damped, then 0
amp = []                    # no knots: never damped

[drive]
db = 0.0                    # small-signal gain; 0 = bypass

[output]
sample_rate = 48000
format      = "float32"     # "float32" | "pcm24" | "pcm16"
mode        = "gain"        # "gain" | "peak"
db          = -6.0          # gain in dB, or peak target in dBFS
polarity    = 1
