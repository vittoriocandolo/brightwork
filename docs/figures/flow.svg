<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" width="760" height="225" role="img" aria-label="The signal flow from patch to file"><title>The signal flow from patch to file</title><style>
.bg{fill:#ffffff}.fg{fill:#1f2328}.dim{fill:#59636e}.axis{stroke:#59636e;stroke-width:1}
.grid{stroke:#d1d9e0;stroke-width:1}.box{fill:#f6f8fa;stroke:#59636e;stroke-width:1}
.c0{stroke:#0969da;fill:none;stroke-width:1.6}.c1{stroke:#bf3989;fill:none;stroke-width:1.6}
.c2{stroke:#1a7f37;fill:none;stroke-width:1.6}.c3{stroke:#9a6700;fill:none;stroke-width:1.6}
.f0{fill:#0969da}.f1{fill:#bf3989}.f2{fill:#1a7f37}.f3{fill:#9a6700}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px}
.title{font-size:15px;font-weight:600}.small{font-size:11px}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.fg{fill:#f0f6fc}.dim{fill:#9198a1}
.axis{stroke:#9198a1}.grid{stroke:#3d444d}.box{fill:#151b23;stroke:#9198a1}
.c0{stroke:#4493f8}.c1{stroke:#db61a2}.c2{stroke:#3fb950}.c3{stroke:#d29922}
.f0{fill:#4493f8}.f1{fill:#db61a2}.f2{fill:#3fb950}.f3{fill:#d29922}}
</style><rect class="bg" width="760" height="225" rx="10"/><text class="fg title" x="20" y="28">Signal flow</text><text class="dim" x="20" y="47">from a patch to a WAV</text><rect class="box" x="20.0" y="70" width="96" height="104" rx="6"/><text class="fg" x="68.0" y="92.0" text-anchor="middle">sources</text><text class="dim small" x="68.0" y="116.0" text-anchor="middle">noise: modes or</text><text class="dim small" x="68.0" y="131.0" text-anchor="middle">noise; tones:</text><text class="dim small" x="68.0" y="146.0" text-anchor="middle">partials</text><rect class="box" x="124.67" y="70" width="96" height="104" rx="6"/><text class="fg" x="172.7" y="92.0" text-anchor="middle">sub-bands</text><text class="dim small" x="172.7" y="116.0" text-anchor="middle">each on its</text><text class="dim small" x="172.7" y="131.0" text-anchor="middle">time map:</text><text class="dim small" x="172.7" y="146.0" text-anchor="middle">damping, bloom</text><line class="axis" x1="116.0" y1="122" x2="122.67" y2="122"/><rect class="box" x="229.34" y="70" width="96" height="104" rx="6"/><text class="fg" x="277.3" y="92.0" text-anchor="middle">gates</text><text class="dim small" x="277.3" y="116.0" text-anchor="middle">chatter, and</text><text class="dim small" x="277.3" y="131.0" text-anchor="middle">a rattle&#x27;s</text><text class="dim small" x="277.3" y="146.0" text-anchor="middle">collisions</text><line class="axis" x1="220.67000000000002" y1="122" x2="227.34" y2="122"/><rect class="box" x="334.01" y="70" width="96" height="104" rx="6"/><text class="fg" x="382.0" y="92.0" text-anchor="middle">damper</text><text class="dim small" x="382.0" y="116.0" text-anchor="middle">a hand or</text><text class="dim small" x="382.0" y="131.0" text-anchor="middle">a foot on</text><text class="dim small" x="382.0" y="146.0" text-anchor="middle">every source</text><line class="axis" x1="325.34" y1="122" x2="332.01" y2="122"/><rect class="box" x="438.68" y="70" width="96" height="104" rx="6"/><text class="fg" x="486.7" y="92.0" text-anchor="middle">drive</text><text class="dim small" x="486.7" y="116.0" text-anchor="middle">tanh, at 32×</text><text class="dim small" x="486.7" y="131.0" text-anchor="middle">the sample</text><text class="dim small" x="486.7" y="146.0" text-anchor="middle">rate</text><line class="axis" x1="430.01" y1="122" x2="436.68" y2="122"/><rect class="box" x="543.35" y="70" width="96" height="104" rx="6"/><text class="fg" x="591.4" y="92.0" text-anchor="middle">decimator</text><text class="dim small" x="591.4" y="116.0" text-anchor="middle">frozen, 116 dB</text><text class="dim small" x="591.4" y="131.0" text-anchor="middle">down, to the</text><text class="dim small" x="591.4" y="146.0" text-anchor="middle">file&#x27;s rate</text><line class="axis" x1="534.6800000000001" y1="122" x2="541.35" y2="122"/><rect class="box" x="648.02" y="70" width="96" height="104" rx="6"/><text class="fg" x="696.0" y="92.0" text-anchor="middle">file</text><text class="dim small" x="696.0" y="116.0" text-anchor="middle">gain or peak;</text><text class="dim small" x="696.0" y="131.0" text-anchor="middle">float or</text><text class="dim small" x="696.0" y="146.0" text-anchor="middle">dithered PCM</text><line class="axis" x1="639.35" y1="122" x2="646.02" y2="122"/><text class="dim" x="20.0" y="205.0" text-anchor="start">Every stage before the decimator is a pure function of time; every render says whether it is validated.</text></svg>
